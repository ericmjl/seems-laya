name: seems-laya
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${SEEMS_PORT:-3004}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      SEEMS_CACHE: /tmp/seems-cache.sqlite
      LAYA_URL: http://laya:8000
    depends_on:
      - laya
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  laya:
    build: .
    command: python -m seems serve --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    init: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  hf-cache:
